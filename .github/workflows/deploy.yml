name: Deploy to Vercel

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '14'

      - name: Install dependencies
        run: npm install

      - name: Build the project
        run: npm run build

      - name: Deploy to Vercel
        uses: vercel/vercel-action@v20.0.0
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }} # Set this secret in your GitHub repository settings
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }} # Set this secret in your GitHub repository settings
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }} # Set this secret in your GitHub repository settings
          vercel-args: '--prod'
          working-directory: ./nextjs-portfolio